name: Bug report / Relatar erro / Reportar error
description: Something broke on your console / Algo quebrou no seu console / Algo falló en tu consola
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The logs are what make a bug fixable, so please grab them before opening the app again.
        Valeu por relatar! São os logs que deixam o erro consertável, então pegue antes de abrir o app de novo.
        ¡Gracias por reportar! Los logs son los que permiten arreglar el error, así que sácalos antes de volver a abrir la app.

        **Never attach `yt-console-account.json` or any account, cookie or pairing file.** / **Nunca anexe o `yt-console-account.json` nem arquivo de conta, cookie ou pareamento.** / **Nunca adjuntes `yt-console-account.json` ni archivos de cuenta, cookies o emparejamiento.**
  - type: input
    id: version
    attributes:
      label: Tube360 version / Versão / Versión
      placeholder: "0.3.2"
    validations:
      required: true
  - type: dropdown
    id: console
    attributes:
      label: Console / Console / Consola
      options:
        - "Fat (original, big)"
        - "Slim / S (black, glossy or matte)"
        - "E (two-tone, newest)"
        - "Don't know / Não sei / No sé"
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Motherboard, if you know it / Placa-mãe, se souber / Placa base, si la sabes
      placeholder: "Xenon, Zephyr, Falcon, Jasper, Trinity, Corona, Winchester"
  - type: dropdown
    id: exploit
    attributes:
      label: Exploit / Desbloqueio / Desbloqueo
      options:
        - BadUpdate
        - ABadAvatar
        - RGH
        - JTAG
        - "Other / Outro / Otro"
    validations:
      required: true
  - type: dropdown
    id: launcher
    attributes:
      label: Opened from / Aberto pelo / Abierto desde
      options:
        - Aurora
        - FSD
        - XeXMenu
        - "Other / Outro / Otro"
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Tube360 folder is on / A pasta do Tube360 está no / La carpeta de Tube360 está en
      options:
        - "Internal HDD / HD interno / Disco interno"
        - "USB stick / Pendrive / Memoria USB"
        - "External HDD / HD externo / Disco externo"
    validations:
      required: true
  - type: dropdown
    id: cable
    attributes:
      label: Video cable / Cabo de vídeo / Cable de video
      options:
        - HDMI
        - "Component / Componente"
        - VGA
        - "Composite (AV) / Composto (AV) / Compuesto (AV)"
    validations:
      required: true
  - type: dropdown
    id: resolution
    attributes:
      label: Dashboard resolution / Resolução no painel / Resolución en el panel
      options:
        - 1080p
        - 1080i
        - 720p
        - 480p
        - 480i
        - "Don't know / Não sei / No sé"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / O que aconteceu? / ¿Qué pasó?
      description: What you did, what you expected and what happened instead. / O que você fez, o que esperava e o que aconteceu. / Qué hiciste, qué esperabas y qué pasó.
      placeholder: "Opened Tube360 from Aurora, white flash, then the console froze."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Right after the crash or freeze, before opening the app again, open the Tube360 folder over FTP and drag `startup.log`, `launcher.log` and every `boot-*.log` here.
        Logo depois do travamento, antes de abrir o app de novo, abra a pasta do Tube360 por FTP e arraste aqui o `startup.log`, o `launcher.log` e todos os `boot-*.log`.
        Justo después del fallo, antes de volver a abrir la app, entra a la carpeta de Tube360 por FTP y arrastra aquí `startup.log`, `launcher.log` y todos los `boot-*.log`.
  - type: textarea
    id: screen
    attributes:
      label: Photo or video of the screen / Foto ou vídeo da tela / Foto o video de la pantalla
      description: If the app shows an error screen, a photo helps a lot. / Se aparecer uma tela de erro, uma foto ajuda muito. / Si aparece una pantalla de error, una foto ayuda mucho.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Privacidade / Privacidad
      options:
        - label: I did not attach any account, cookie or pairing file. / Não anexei nenhum arquivo de conta, cookie ou pareamento. / No adjunté archivos de cuenta, cookies ni emparejamiento.
          required: true
